name: Software checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  unit-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      NO_PROXY: localhost,127.0.0.1,::1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - if: runner.os == 'Linux'
        run: |
          sh -n start_ubuntu.sh
          sh -n start_ubuntu_training_test.sh
          sh -n start_ubuntu_lumos.sh
          apt-get -o DPkg::Lock::Timeout=1 -o Acquire::Retries=3 --no-remove --simulate install ffmpeg
      - run: python tools/build_runtime_package.py
      - run: python tools/check_distribution.py
      - run: python tools/build_touch_gripper_visual.py --check
      - run: python tools/build_ld_servo_map.py --check
      - if: runner.os == 'Linux'
        name: Unpack Ubuntu template into an empty root
        run: |
          root=$(mktemp -d)
          sudo mkdir -p "$root/var/lib/dpkg"
          sudo touch "$root/var/lib/dpkg/status"
          sudo dpkg --root="$root" --unpack Browser_SDK/downloads/act-runtime-template.deb
          test -f "$root/opt/star-arm-act/Browser_SDK/index.html"
      - run: python tools/check_file_map.py
      - if: runner.os == 'Windows'
        run: python tools/package_browser_local.py
      - if: runner.os == 'Linux'
        run: python tools/package_training_local.py
      - if: runner.os == 'Linux'
        run: python tools/package_lumos_local.py
  browser-check:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
      NO_PROXY: localhost,127.0.0.1,::1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: python tools/check_distribution.py --generated dist/browser-generated.deb
      - name: Unpack browser installer into an empty root
        run: |
          root=$(mktemp -d)
          sudo mkdir -p "$root/var/lib/dpkg"
          sudo touch "$root/var/lib/dpkg/status"
          sudo dpkg --root="$root" --unpack dist/browser-generated.deb
          test -f "$root/opt/star-arm-act/Browser_SDK/index.html"
